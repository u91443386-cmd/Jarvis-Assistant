plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jarvis.voiceassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.jarvis.voiceassistant"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
            ndk {
        abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/DEPENDENCIES'
        // Vosk native libs may contain duplicate .so files
        pickFirst 'lib/**/*.so'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

// Picovoice Porcupine (Free 1.9 version)
implementation 'ai.picovoice:porcupine-android:1.9.5'
// Coroutines (Optional but used in some updates)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
