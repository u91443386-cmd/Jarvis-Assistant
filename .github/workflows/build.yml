name: Secure Automated App Builder
on: [push, workflow_dispatch]
jobs:
  assemble_package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - name: Inject Locked Gradle Wrapper Engine Execution
        run: |
          yes | sdkmanager --licenses || true
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: Jarvis-Voice-Assistant-APK, path: app/build/outputs/apk/debug/app-debug.apk }
