name: Android Unified Cloud Build Engine

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17 Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      # Direct stable 8.4 tool set karna bina automatic cloud system loop ke
      - name: Inject Sealed Gradle Engine
        run: |
          yes | sdkmanager --licenses || true
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          
          # Custom wrapper injection template
          cat << 'EOF' > gradlew
          #!/usr/bin/env sh
          APP_BASE_NAME=${0##*/}
          APP_HOME=$(dirname "$0")
          [ -n "$CLASSPATH" ] || CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          export CLASSPATH
          exec java org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Compile and Build Debug APK File
        run: |
          ./gradlew assembleDebug

      - name: Upload Final Downloadable APK File
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Voice-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
