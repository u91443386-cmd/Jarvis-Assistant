name: Secure Automated App Builder

on: [push, workflow_dispatch]

jobs:
  assemble_package:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Source Code Assets
        uses: actions/checkout@v4
      
      - name: Initialize Java 17 Runtime environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Initialize Sandboxed Build Engine
        run: |
          yes | sdkmanager --licenses || true
          gradle wrapper --gradle-version 8.4 --distribution-type bin

      - name: Execute Binary Application Packaging
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Securely Export Target Application Package
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Voice-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
